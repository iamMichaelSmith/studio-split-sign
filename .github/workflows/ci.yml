name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Install isolated PostgreSQL test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm run test:postgres
        env:
          RELEASE_TEST_PG_BIN: /usr/lib/postgresql/16/bin
